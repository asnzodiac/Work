<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>App Launcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #121212; color: #fff; }
    #setup-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; text-align: center; }
    .upload-card { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px dashed #444; max-width: 400px; width: 100%; }
    input[type="file"] { display: none; }
    .btn { display: inline-block; margin-top: 15px; padding: 12px 24px; background: #0070f3; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }
    #app-frame { width: 100%; height: 100%; border: none; display: none; }
    #reset-trigger { position: fixed; bottom: 8px; right: 8px; opacity: 0.1; background: #fff; width: 20px; height: 20px; border-radius: 50%; border: none; cursor: pointer; z-index: 9999; }
    #reset-trigger:hover { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- Initial Setup Screen -->
  <div id="setup-view">
    <div class="upload-card">
      <h2>Load Web App</h2>
      <p style="margin: 10px 0; color: #aaa; font-size: 14px;">Select your private HTML file. It will be stored securely in your browser's local memory.</p>
      <label class="btn" for="file-input">Choose HTML File</label>
      <input type="file" id="file-input" accept=".html,.htm">
    </div>
  </div>

  <!-- Runtime Container -->
  <iframe id="app-frame" sandbox="allow-scripts allow-forms allow-modals allow-downloads"></iframe>

  <!-- Hidden button in bottom-right corner to clear data / reload new file -->
  <button id="reset-trigger" title="Reset Stored App" onclick="resetApp()"></button>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const DB_NAME = 'LocalAppDB';
    const STORE_NAME = 'app_store';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveHTML(content) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(content, 'saved_index');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getHTML() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get('saved_index');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    function launch(htmlString) {
      document.getElementById('setup-view').style.display = 'none';
      const frame = document.getElementById('app-frame');
      frame.style.display = 'block';
      frame.srcdoc = htmlString;
    }

    async function init() {
      const storedHTML = await getHTML();
      if (storedHTML) {
        launch(storedHTML);
      }
    }

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        const content = event.target.result;
        await saveHTML(content);
        launch(content);
      };
      reader.readAsText(file);
    });

    async function resetApp() {
      if (confirm('Clear the loaded app and upload a new HTML file?')) {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete('saved_index');
        tx.oncomplete = () => location.reload();
      }
    }

    init();
  </script>
</body>
</html>
